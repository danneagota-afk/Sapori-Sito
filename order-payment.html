*{box-sizing:border-box}body{margin:0;background:#f4eee5;color:#49362a;font:15px/1.5 system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:auto;padding:18px 24px;border-bottom:1px solid #e0d5c8}.brand{display:flex;gap:12px;align-items:center;font:23px Georgia,serif}.brand img{width:40px;height:40px;border-radius:50%}button,a{touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid #9b7956;outline-offset:3px}main{width:min(calc(100% - 28px),650px);margin:clamp(22px,5vw,65px) auto}.card{padding:clamp(20px,5vw,42px);border:1px solid #ded0be;background:#fffdf9;border-radius:20px;box-shadow:0 12px 40px #49362a0b}.center{text-align:center}.mark{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;margin:0 auto 16px;background:#f0e6d9;color:#886947;font-size:31px}.paid .mark{background:#e5eee2;color:#42634b}.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:700;color:#81694d}h1{font:clamp(29px,5vw,43px)/1.1 Georgia,serif;margin:13px 0}h2{font:23px Georgia,serif;margin:0 0 12px}p{color:#786655;margin:10px 0}.summary{padding:18px;background:#f7f2eb;border:1px solid #e9e1d7;border-radius:12px;margin:24px 0}.line{display:flex;align-items:start;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #e1d6c8}.line span{overflow-wrap:anywhere}.line strong{white-space:nowrap}.total{font-size:19px;border:0;padding-top:12px}.small{font-size:12px;color:#786655}.actions{display:grid;gap:10px;margin-top:20px}button,.action{display:block;border:1px solid #49362a;border-radius:9px;background:transparent;color:#49362a;text-align:center;text-decoration:none;padding:12px 16px;font:600 14px/1.4 system-ui;cursor:pointer}.primary{background:#49362a;color:#fff}#language{padding:8px 13px}footer{text-align:center;color:#786655;font-size:12px;margin:24px}[hidden]{display:none!important}@media(max-width:370px){.brand{font-size:19px}header{padding:12px}.card{padding:17px}}
</style><script src="supabase-config.js"></script></head><body><header><div class="brand"><img src="assets/icon-192.png" alt="">Sapori Rumeni</div><button id="language" type="button">RO</button></header><main><section class="card" id="card"><div class="center"><div id="mark" class="mark" aria-hidden="true">…</div><div class="eyebrow" id="eyebrow">ORDINE DI PROVA · SANDBOX</div><div role="status" aria-live="polite"><h1 id="heading">Verifica del pagamento…</h1><p id="message"></p></div></div><section class="summary" id="summary" hidden><h2 id="summaryTitle"></h2><div class="small" id="number"></div><div id="products"></div><div class="line total"><span id="totalLabel"></span><strong id="amount"></strong></div><p id="pickup"></p></section><p class="small" id="note"></p><div class="actions"><button class="primary" id="copy" hidden></button><button id="retry" type="button" hidden></button><a class="action" id="orders" href="account.html" hidden></a><a class="action" id="shop" href="index.html#shop"></a></div><p class="small" id="copyMsg" role="status"></p></section></main><footer>Sapori Rumeni · Villafranca di Verona</footer><script>
'use strict';const $=id=>document.getElementById(id);const token=location.hash.slice(1);const valid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token);const cancel=new URLSearchParams(location.search).get('cancel')==='1';let lang='it',status='loading',order=null,busy=false;try{lang=localStorage.getItem('sr_language')==='ro'?'ro':'it';}catch{}const tr=(it,ro)=>lang==='ro'?ro:it;const money=n=>Number(n).toLocaleString(lang==='ro'?'ro-RO':'it-IT',{style:'currency',currency:'EUR'});const text=(id,v)=>$(id).textContent=v;
function render(){document.documentElement.lang=lang;document.title=tr('Ordine di prova','Comandă de test')+' | Sapori Rumeni';text('language',tr('RO','IT'));text('eyebrow',tr('ORDINE DI PROVA · SANDBOX','COMANDĂ DE TEST · SANDBOX'));const messages={loading:[tr('Verifica del pagamento…','Se verifică plata…'),tr('Stiamo controllando Stripe.','Verificăm Stripe.')],paid:[tr('Grazie per il tuo ordine!','Mulțumim pentru comandă!'),tr('Il pagamento di prova è stato confermato da Stripe.','Plata de test a fost confirmată de Stripe.')],pending:[tr('Pagamento in attesa','Plată în așteptare'),tr('Stripe non ha ancora confermato il pagamento.','Stripe nu a confirmat încă plata.')],expired:[tr('Pagamento annullato o scaduto','Plată anulată sau expirată'),tr('Il carrello di prova è stato conservato.','Coșul de test a fost păstrat.')],failed:[tr('Pagamento non riuscito','Plată nereușită'),tr('Puoi riprovare dal carrello di prova.','Poți încerca din nou din coș.')],error:[tr('Verifica non disponibile','Verificare indisponibilă'),tr('Non considerare il pagamento confermato. Riprova.','Plata nu este confirmată. Încearcă din nou.')],missing:[tr('Ordine non disponibile','Comandă indisponibilă'),tr('Apri il link privato ricevuto alla conferma.','Deschide linkul privat primit la confirmare.')]};const cash=order?.payment==='store'&&status==='pending';text('heading',cash?tr('Ordine di prova ricevuto!','Comandă de test primită!'):messages[status][0]);text('message',cash?tr('Pagamento in contanti simulato al ritiro. Nessun pagamento ricevuto.','Plată simulată în numerar la ridicare. Nicio plată încasată.'):messages[status][1]);$('card').classList.toggle('paid',status==='paid'||cash);text('mark',status==='paid'||cash?'✓':status==='loading'?'…':'!');text('note',tr('Solo simulazione: nessun addebito, preparazione o consegna reale. Conserva il link in privato.','Doar simulare: fără debitare, pregătire sau livrare reală. Păstrează linkul în privat.'));text('copy',tr('Copia link del tuo ordine','Copiază linkul comenzii'));text('retry',tr('Aggiorna stato','Actualizează starea'));text('orders',tr('I miei ordini','Comenzile mele'));text('shop',tr('Torna al negozio','Înapoi la magazin'));$('retry').hidden=!valid||busy;$('copy').hidden=!order;$('orders').hidden=!order?.registered;$('summary').hidden=!order;
if(order){text('summaryTitle',tr('Riepilogo ordine','Rezumatul comenzii'));text('number','TEST · '+order.id.slice(0,8).toUpperCase());text('totalLabel',tr(status==='paid'?'Totale pagato (test)':'Totale simulato',status==='paid'?'Total plătit (test)':'Total simulat'));text('amount',money(order.total));text('pickup',tr('Ritiro simulato: ','Ridicare simulată: ')+new Date(order.pickup_at).toLocaleString(lang==='ro'?'ro-RO':'it-IT',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Rome'}));$('products').replaceChildren();for(const p of order.products||[]){const row=document.createElement('div');row.className='line';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=(p[lang]||p.it)+' × '+p.qty+' '+p.unit;b.textContent=money(p.lineTotal);row.append(a,b);$('products').append(row);}const discount=(order.products||[]).reduce((a,p)=>a+Number(p.lineTotal),0)-Number(order.total);if(discount>.004){const row=document.createElement('div');row.className='line';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=tr('Sconto','Reducere');b.textContent='−'+money(discount);row.append(a,b);$('products').append(row);}}}
function clearAttempt(){try{const pending=JSON.parse(sessionStorage.getItem('sr66_checkout')||'null');if(pending?.token!==token)return;if(status==='paid'||order?.payment==='store'&&status==='pending'){const invite=sessionStorage.getItem('sr66_invite');const key='sr66_test_cart:'+invite;if(invite&&pending.invite===invite){const cart=JSON.parse(sessionStorage.getItem(key)||'null');if(cart&&JSON.stringify(cart.cart)===JSON.stringify(pending.cart)){cart.cart={};sessionStorage.setItem(key,JSON.stringify(cart));}}}if(['paid','expired','failed'].includes(status)||order?.payment==='store'&&status==='pending'){sessionStorage.removeItem('sr66_checkout');sessionStorage.removeItem('sr66_pending_order');}}catch{}}
async function verify(){if(busy)return;if(!valid){status='missing';render();return;}busy=true;render();try{const saved=await srRequest('/rest/v1/rpc/sr66_track',{k:token});const result=saved?.payment==='store'?saved:await srRequest('/functions/v1/stripe-orders',{action:cancel?'cancel':'status',token});if(!result?.id||!['paid','pending','expired','failed'].includes(result.status))throw Error();order=result;status=result.status;clearAttempt();if(cancel&&status!=='pending')history.replaceState(null,'',location.pathname+'#'+token);}catch(e){status='error';}finally{busy=false;render();}}
$('language').onclick=()=>{lang=lang==='it'?'ro':'it';try{localStorage.setItem('sr_language',lang)}catch{}render();};$('retry').onclick=verify;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.origin+location.pathname+'#'+token);text('copyMsg',tr('Link copiato.','Link copiat.'));}catch{text('copyMsg',tr('Copia l’indirizzo dalla barra del browser.','Copiază adresa din browser.'));}};verify();
