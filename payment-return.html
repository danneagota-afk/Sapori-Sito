'use strict';const $=id=>document.getElementById(id);let lang='it';try{lang=localStorage.getItem('sr_language')==='ro'?'ro':'it'}catch{};const q=new URLSearchParams(location.search),id=q.get('session_id'),ticket=q.get('ticket');let state=q.get('cancel')==='1'?'cancel':id&&ticket?'loading':'missing';const words={it:{eyebrow:'PAGAMENTO DI PROVA · SANDBOX',note:'Questa prova non crea ordini nel negozio e non comporta addebiti reali.',orders:'I miei ordini',shop:'Torna al negozio',amount:'Importo simulato',retry:'Verifica di nuovo',loading:['Verifica del pagamento…','Stiamo controllando l’esito con Stripe.'],paid:['Pagamento di prova riuscito.','Stripe ha confermato il pagamento simulato. Grazie!'],pending:['Pagamento non confermato.','Stripe non ha ancora confermato il pagamento. Puoi verificare di nuovo.'],error:['Verifica non disponibile.','Non possiamo confermare il pagamento in questo momento. Controlla Stripe o riprova.'],cancel:['Pagamento annullato.','Sei tornato al negozio senza completare questa prova.'],missing:['Esito non disponibile.','Per verificare un pagamento di prova, apri una nuova sessione Stripe.']},ro:{eyebrow:'PLATĂ DE TEST · SANDBOX',note:'Acest test nu creează comenzi în magazin și nu implică plăți reale.',orders:'Comenzile mele',shop:'Înapoi la magazin',amount:'Sumă simulată',retry:'Verifică din nou',loading:['Se verifică plata…','Verificăm rezultatul cu Stripe.'],paid:['Plată de test reușită.','Stripe a confirmat plata simulată. Mulțumim!'],pending:['Plată neconfirmată.','Stripe nu a confirmat încă plata. Poți verifica din nou.'],error:['Verificare indisponibilă.','Nu putem confirma plata momentan. Verifică în Stripe sau încearcă din nou.'],cancel:['Plată anulată.','Ai revenit la magazin fără a finaliza testul.'],missing:['Rezultat indisponibil.','Pentru a verifica o plată de test, deschide o nouă sesiune Stripe.']}};function render(){const w=words[lang];document.documentElement.lang=lang;document.title=(lang==='it'?'Esito pagamento':'Rezultat
